name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run the pipeline on a branch without an empty commit — used to gather the
  # repeat-run evidence for a CI stability fix (docs/ci-test-runbook.md).
  workflow_dispatch:

# A new push to the same PR supersedes the run in flight; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # PRs land on main as a squash, so the PR *title* becomes the commit subject —
  # that, not the branch's commits, is what has to satisfy commitlint. The local
  # commit-msg hook can't see it, so this is the only place it gets checked.
  commit-message:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Via env, never inlined into the script: a PR title is attacker-controlled text.
      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | bunx --bun commitlint

  # The checks run as parallel jobs so wall-clock is the slowest one, not the
  # sum. Install is ~5s per job (setup-bun restores ~/.bun/install/cache keyed
  # on bun.lock), so the duplication is cheap.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run doc-lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The Docker build stage uses Bun even for commands named `node`.
      - run: bun run --bun build

  # The suite boots a real server per integration file, which is CPU-bound on
  # the 2-vCPU runner; sharding across runners is what brings the step down.
  # `drawingBrowser` is excluded here because it is 98 tests that each reload
  # the whole app fixture: sharing a 2-vCPU runner with the other browser files
  # is what turned one slow load into a cascade of 30s hook timeouts and an
  # 11-minute job (see run 42595435659). It has a job of its own below.
  test:
    runs-on: ubuntu-latest
    # A hung shard fails here instead of running until a superseding push
    # cancels it: a normal shard is ~3 min, the worst observed 11m43s.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # `bun run test`, not `bun test`: the suite is vitest, and `bun test`
      # would run Bun's own runner against the same files.
      # The exclude is a root-relative glob, not a bare path: vitest matches it
      # against the absolute specifier, so a bare tests/... silently matched
      # nothing and drew the file in every shard as well.
      # --retry=0 keeps a failure a failure: a rerun is a deliberate, recorded
      # act (docs/ci-test-runbook.md), never something the pipeline does for us.
      - run: bun run test -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --exclude '**/tests/drawingBrowser.test.ts' --retry=0

  # The heaviest browser file, alone on its runner. It reads a real Chromium
  # and the whole Stage fixture 98 times; on a starved runner a single fixture
  # load can pass 30s, so the file gets a hook budget sized for that (see the
  # describe options in tests/drawingBrowser.test.ts) and a hard job timeout.
  test-drawing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test -- tests/drawingBrowser.test.ts --retry=0 --no-file-parallelism

  # One status that stands for every test job, so a required check or a merge
  # queue names "tests" rather than each "test (N)"; renumbering the matrix
  # never silently drops a protection.
  tests:
    needs: [test, test-drawing]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.test-drawing.result }}" = success
